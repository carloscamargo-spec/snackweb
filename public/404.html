<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | Snack &amp; Soda</title>
    <link rel="icon" type="image/png" href="/logo-snack-and-soda-white.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet" />
    <style>
      :root { --brand: #e6fd31; --ink: #0a0a0a; --paper: #f5f5f0; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--ink); color: var(--paper);
        font-family: Inter, system-ui, sans-serif;
      }
      main { max-width: 640px; }
      .code { color: var(--brand); font-weight: 900; font-size: clamp(5rem, 22vw, 12rem); line-height: .85; letter-spacing: -0.045em; }
      h1 { font-weight: 900; font-size: clamp(1.75rem, 6vw, 3rem); line-height: 1; letter-spacing: -0.03em; margin: 24px 0 16px; }
      p { opacity: .75; line-height: 1.5; margin-bottom: 32px; }
      a { display: inline-block; background: var(--brand); color: var(--ink); font-weight: 900; text-decoration: none; padding: 14px 24px; }
      a:hover { filter: brightness(.92); }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Esta página no está en la parrilla.</h1>
      <p>El enlace que seguiste no existe o cambió de lugar.</p>
      <a href="/">Volver a snackandsoda.co</a>
    </main>
  </body>
</html>
